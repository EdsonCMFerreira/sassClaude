app = "saas-claude-edsonferreira"
primary_region = "gru"

[build]

[env]
  ConnectionStrings__DefaultConnection = "Data Source=/data/Saas.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "saas_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
